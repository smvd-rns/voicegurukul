name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Trigger Remote Pull & Build on Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: '168.144.188.213'
          username: 'root'
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /var/www/voicegurukul
            git pull origin main
            export NODE_OPTIONS="--max-old-space-size=2048"
            ./node_modules/.bin/next build
            pm2 restart voicegurukul || pm2 start npm --name "voicegurukul" -- start
            pm2 save
