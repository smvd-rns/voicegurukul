name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env.production
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js Application (Cloud Runner)
        run: npm run build

      - name: Copy Build Artifacts to Droplet via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: ".next"
          target: "/var/www/voicegurukul"

      - name: Copy .env file to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: ".env"
          target: "/var/www/voicegurukul"

      - name: Restart Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /var/www/voicegurukul
            git pull origin main
            npm ci --production
            # Use --update-env so PM2 picks up the freshly deployed .env file
            pm2 restart voicegurukul --update-env || pm2 start npm --name "voicegurukul" -- start
            
            # Setup and restart the indexer microservice
            cd /var/www/voicegurukul/indexer-service
            npm install --production
            pm2 restart voicegurukul-indexer || pm2 start server.js --name "voicegurukul-indexer"
            
            pm2 save

