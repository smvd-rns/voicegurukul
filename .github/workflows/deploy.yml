name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file from Secret
        if: env.ENV_FILE != ''
        run: |
          echo "$ENV_FILE" > .env.production
          echo "$ENV_FILE" > .env

      - name: Build Next.js Application (Cloud Runner)
        run: npm run build

      - name: Compress Build Artifacts
        run: tar -czf next-build.tar.gz --exclude='.next/cache' .next

      - name: Copy Build Artifacts to Droplet via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "next-build.tar.gz"
          target: "/var/www/voicegurukul"
          overwrite: true
          timeout: 120s

      - name: Copy .env file to Droplet
        if: env.ENV_FILE != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: ".env"
          target: "/var/www/voicegurukul"
          overwrite: true
          timeout: 60s

      - name: Restart Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          timeout: 180s
          script: |
            cd /var/www/voicegurukul
            # Ensure branch is clean and strictly matches origin/main without merge conflicts
            git fetch origin main
            git checkout -f main || git checkout -f -B main origin/main
            git reset --hard origin/main

            # Extract new build artifacts safely
            if [ -f "next-build.tar.gz" ]; then
              echo "Extracting new Next.js build artifacts..."
              rm -rf .next
              tar -xzf next-build.tar.gz
              rm -f next-build.tar.gz
              echo "Build artifacts unpacked successfully."
            fi

            # Auto-upgrade Node.js on droplet if version is older than 22.23.4 (Fixes Brotli CVE)
            NODE_CURRENT=$(node -v 2>/dev/null || echo "v0")
            echo "Current droplet Node.js version: $NODE_CURRENT"
            if [[ "$NODE_CURRENT" =~ ^v(1[0-9]|20|21|22\.([0-9]|1[0-9]|2[0-2])\.) ]]; then
              echo "Upgrading Node.js to Node 22 LTS on droplet..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
              echo "Upgraded Node.js to: $(node -v)"
            fi

            # Install production dependencies safely without wiping node_modules (prevents OOM & next not found)
            npm install --omit=dev --prefer-offline --no-audit --no-fund

            # Restart PM2 Next.js application
            pm2 restart voicegurukul --update-env || pm2 start npm --name "voicegurukul" -- start

            # Setup and restart indexer microservice if present
            if [ -d "/var/www/voicegurukul/indexer-service" ]; then
              cd /var/www/voicegurukul/indexer-service
              npm install --omit=dev --prefer-offline --no-audit --no-fund
              pm2 restart voicegurukul-indexer --update-env || pm2 start server.js --name "voicegurukul-indexer" || true
            fi

            pm2 save

