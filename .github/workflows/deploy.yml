name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Build on Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /var/www/voicegurukul
            git pull origin main
            
            # Install dependencies and build on the server using local .env
            npm install
            npm run build
            pm2 restart voicegurukul || pm2 start npm --name "voicegurukul" -- start
            
            # Setup and restart the indexer microservice
            cd /var/www/voicegurukul/indexer-service
            npm install --production
            pm2 restart voicegurukul-indexer || pm2 start server.js --name "voicegurukul-indexer"
            
            pm2 save
