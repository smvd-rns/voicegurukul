name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci || npm install --prefer-offline --no-audit

      - name: Create .env file from Secret
        if: env.ENV_FILE != ''
        run: |
          echo "$ENV_FILE" > .env.production
          echo "$ENV_FILE" > .env

      - name: Build Next.js Application (Cloud Runner)
        run: npm run build

      - name: Compress Build Artifacts
        run: tar -czf next-build.tar.gz --exclude='.next/cache' .next

      - name: Deploy Build Artifacts to Droplet
        env:
          SSHPASS: ${{ secrets.DROPLET_PASSWORD }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          echo "Installing OpenSSH tools..."
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client

          echo "Uploading Next.js build artifacts to droplet..."
          sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 next-build.tar.gz ${DROPLET_USER}@${DROPLET_HOST}:/var/www/voicegurukul/

          if [ -f ".env" ]; then
            echo "Uploading .env to droplet..."
            sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 .env ${DROPLET_USER}@${DROPLET_HOST}:/var/www/voicegurukul/
          fi

          echo "Connecting to droplet to extract build and restart server..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 ${DROPLET_USER}@${DROPLET_HOST} << 'EOF'
            set -e
            cd /var/www/voicegurukul

            # Ensure branch is clean and strictly matches origin/main without merge conflicts
            git fetch origin main
            git checkout -f main || git checkout -f -B main origin/main
            git reset --hard origin/main

            # Extract new build artifacts safely
            if [ -f "next-build.tar.gz" ]; then
              echo "Extracting new Next.js build artifacts..."
              rm -rf .next
              tar -xzf next-build.tar.gz
              rm -f next-build.tar.gz
              echo "Build artifacts unpacked successfully."
            fi

            # Install production dependencies safely without wiping node_modules
            npm install --omit=dev --prefer-offline --no-audit --no-fund

            # Restart PM2 Next.js application
            pm2 restart voicegurukul --update-env || pm2 start npm --name "voicegurukul" -- start

            # Setup and restart indexer microservice if present
            if [ -d "/var/www/voicegurukul/indexer-service" ]; then
              cd /var/www/voicegurukul/indexer-service
              npm install --omit=dev --prefer-offline --no-audit --no-fund
              pm2 restart voicegurukul-indexer --update-env || pm2 start server.js --name "voicegurukul-indexer" || true
            fi

            pm2 save
            echo "Droplet deployment completed successfully!"
          EOF

