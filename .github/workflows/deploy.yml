name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application (Cloud Runner)
        run: npm run build

      - name: Copy Build Artifacts to Droplet via SCP
        uses: appleboy/scp-action@master
        with:
          host: '168.144.188.213'
          username: 'root'
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: ".next"
          target: "/var/www/voicegurukul"

      - name: Restart Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: '168.144.188.213'
          username: 'root'
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /var/www/voicegurukul
            git pull origin main
            npm ci --production
            pm2 restart voicegurukul || pm2 start npm --name "voicegurukul" -- start
            pm2 save
